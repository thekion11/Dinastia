[preset.3.options]

custom_template/debug=""
custom_template/release=""
## COMPRESION DE TEXTURAS PARA MOVIL. Sin esto (no estaba, ni con este nombre
## ni con ningun valor -el preset de Android se creo en modo simple y nunca
## lo puso-) las texturas viajan SIN comprimir para la GPU: en desktop no se
## nota, pero en un Android real es la diferencia entre que una textura
## cargue bien o se quede en negro/plana en ciertos GPUs y drivers -sintoma
## reportado el 12-9-2026: jugadores sin cara, como una silueta oscura, en el
## celular pero no en las pruebas de escritorio-. ETC2/ASTC es el formato
## comprimido que soporta practicamente cualquier Android desde API 21.
vram_texture_compression/for_mobile=true
## EL KEYSTORE DE PUBLICACION. Sin el, Godot genera el APK igual pero SIN FIRMAR,
## y un APK sin firmar no lo instala ningun telefono: falla con un mensaje que no
## dice que el problema sea la firma. Se reutiliza el que ya se creo para el APK
## de la WebView en agosto, que sigue siendo valido.
keystore/release="C:/Users/Alumno/Desktop/Proyecto x/apk/dinastia.keystore"
keystore/release_user="dinastia"
## La contrasena NO va aqui: vive en export_credentials.cfg (fuera de git,
## ver export_credentials.cfg.ejemplo). Godot 4.4+ ignora este campo.
keystore/release_password=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
