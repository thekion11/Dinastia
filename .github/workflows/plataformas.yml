# Pruebas de EJECUCIÓN fuera de Linux x86 (5-11-2026, sesión «sonar/plataformas»).
# Hasta hoy `banco.sh`/`especiales.sh` solo corrían en Ubuntu (Godot headless); Windows, Android y Web solo se
# EXPORTABAN en compilar.yml. Este flujo, APARTE y sin bloquear ninguna compilación, ejecuta el juego en:
#   🪟 Windows (windows-latest): extensión C++ (.dll) = GDScript + un subconjunto del mini banco con Git Bash.
#   🌐 Web: exporta, sirve y abre en Chromium hasta ver el menú principal (señal DINASTIA_MENU_LISTO), sin errores de consola.
# Android y macOS: ver docs/04_auditorias/cobertura_sistemas_2026-11-05.md (Android no viable en CI; macOS sin preset).
# Sin secretos. Ninguna entrada del flujo se interpola dentro de `run:`.
name: Plataformas (Windows y Web)

on:
  workflow_dispatch:
  push:
    paths:
      - "dinastia-godot/**"
      - ".github/workflows/plataformas.yml"
      - ".github/actions/preparar/**"

permissions:
  contents: read

concurrency:
  group: plataformas-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    name: 🪟 Windows (ejecutar)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      ## Antes de descargar: sin conversión CRLF (los .sh y .gd se leen igual que en Linux).
      - name: Git sin conversión de fin de línea y con rutas largas
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      ## Solo el juego: otras carpetas (p. ej. material/) tienen nombres de archivo que Windows no admite (primer intento: «Filename too long»).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: |
            dinastia-godot
            .github

      - name: Godot 4.7.2 para Windows (consola, con suma de comprobación)
        shell: bash
        env:
          BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/dl"
          curl --proto "=https" --tlsv1.2 -sSLfo godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          curl --proto "=https" --tlsv1.2 -sSLfo SUMS.txt "$BASE/SHA512-SUMS.txt"
          esperado=$(grep " Godot_v${GODOT_VERSION}-stable_win64.exe.zip\$" SUMS.txt | cut -d' ' -f1)
          real=$(sha512sum godot.zip | cut -d' ' -f1)
          test -n "$esperado" && test "$esperado" = "$real" || { echo "Suma SHA-512 de Godot NO coincide"; exit 1; }
          7z x -y -o"$RUNNER_TEMP/godot" godot.zip > /dev/null
          ls -la "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe" "$RUNNER_TEMP/godot/godot.exe"
          cygpath -w "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Extensión C++ (.dll) = GDScript
        shell: bash
        working-directory: dinastia-godot
        run: |
          set +e
          godot --version
          timeout 900 godot --headless --path . res://pruebas/probar_nativo.tscn 2>&1 | tee "$RUNNER_TEMP/nativo.txt"
          grep -q "FIN. 0 fallos" "$RUNNER_TEMP/nativo.txt" || { echo "La extensión nativa no dio «FIN. 0 fallos» en Windows."; exit 1; }

      - name: Mini banco en Windows (grupos guardado, textos, competición y lanzamiento)
        shell: bash
        working-directory: dinastia-godot
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set +e
          malo=0
          for g in guardado textos competicion lanzamiento; do
            bash herramientas/mini_banco.sh "$g" "$(cygpath -u "$RUNNER_TEMP")/mini_$g.txt" || malo=1
          done
          { echo "### 🪟 Windows"; for g in guardado textos competicion lanzamiento; do echo "- $g: $(sed 's/\x1b\[[0-9;]*m//g' "$(cygpath -u "$RUNNER_TEMP")/mini_$g.txt" | grep -a '===== FIN' | tail -1)"; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $malo

      - name: Subir los registros
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-windows-registro
          path: |
            ${{ runner.temp }}/nativo.txt
            ${{ runner.temp }}/mini_*.txt
          if-no-files-found: ignore

  exportar-web:
    name: 🌐 Web (exportar para el humo)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Exportar Web
        uses: ./.github/actions/exportar
        with:
          variante: web
          preset: Web
          salida: web/index.html
          artefacto: Dinastia-Web-humo

  humo-web:
    name: 🌐 Web (abrir en Chromium)
    needs: exportar-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: dinastia-godot/herramientas

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: Dinastia-Web-humo
          path: salida

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Playwright (solo la biblioteca; se usa el Chrome del runner)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp dinastia-godot/herramientas/humo_web.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright-core@1.49.1

      - name: Abrir el juego y esperar el menú
        shell: bash
        run: |
          ls -la salida
          node "$RUNNER_TEMP/pw/humo_web.mjs" salida "$RUNNER_TEMP/capturas/menu_web.jpg" | tee "$RUNNER_TEMP/humo_web.txt"
          grep -q "FIN. 0 fallos" "$RUNNER_TEMP/humo_web.txt"

      - name: Subir la captura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-web-captura
          path: |
            ${{ runner.temp }}/capturas/menu_web.jpg
            ${{ runner.temp }}/humo_web.txt
          if-no-files-found: ignore
