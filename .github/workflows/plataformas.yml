# Pruebas de EJECUCIÓN fuera de Linux x86 (5-11-2026, sesión «sonar/plataformas»).
# Hasta hoy `banco.sh`/`especiales.sh` solo corrían en Ubuntu (Godot headless); Windows, Android y Web solo se
# EXPORTABAN en compilar.yml. Este flujo, APARTE y sin bloquear ninguna compilación, ejecuta el juego en:
#   🪟 Windows (windows-latest): extensión C++ (.dll) = GDScript + un subconjunto del mini banco con Git Bash.
#   🌐 Web: exporta, sirve y abre en Chromium hasta ver el menú principal (señal DINASTIA_MENU_LISTO), sin errores de consola.
# macOS (sin preset de exportación: solo se ejecuta) y Android: ver docs/04_auditorias/cobertura_sistemas_2026-11-05.md.
# Sin secretos. Ninguna entrada del flujo se interpola dentro de `run:`.
name: Plataformas (Windows y Web)

on:
  workflow_dispatch:
  schedule:
    ## Una vez por noche (UTC), después de las especiales completas de `especiales-todo.yml` (05:17). Corre sobre la rama por defecto.
    - cron: "41 6 * * *"
  push:
    paths:
      - "dinastia-godot/**"
      - ".github/workflows/plataformas.yml"
      - ".github/actions/preparar/**"

permissions:
  contents: read

concurrency:
  group: plataformas-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    name: 🪟 Windows (ejecutar)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      ## Antes de descargar: sin conversión CRLF (los .sh y .gd se leen igual que en Linux).
      - name: Git sin conversión de fin de línea y con rutas largas
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      ## Solo el juego: otras carpetas (p. ej. material/) tienen nombres de archivo que Windows no admite (primer intento: «Filename too long»).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: |
            dinastia-godot
            .github

      - name: Godot 4.7.2 para Windows (consola, con suma de comprobación)
        shell: bash
        env:
          BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/dl"
          curl --proto "=https" --tlsv1.2 -sSLfo godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          curl --proto "=https" --tlsv1.2 -sSLfo SUMS.txt "$BASE/SHA512-SUMS.txt"
          esperado=$(grep " Godot_v${GODOT_VERSION}-stable_win64.exe.zip\$" SUMS.txt | cut -d' ' -f1)
          real=$(sha512sum godot.zip | cut -d' ' -f1)
          test -n "$esperado" && test "$esperado" = "$real" || { echo "Suma SHA-512 de Godot NO coincide"; exit 1; }
          7z x -y -o"$RUNNER_TEMP/godot" godot.zip > /dev/null
          ls -la "$RUNNER_TEMP/godot"
          ## (la versión «console» es un envoltorio que busca al ejecutable principal por su nombre: NO se puede renombrar a godot.exe
          ## —«Invalid wrapper executable name»—; se deja tal cual y `godot` es un pequeño script que la llama.)
          printf '#!/usr/bin/env bash\nexec "$(dirname "$0")/Godot_v%s-stable_win64_console.exe" "$@"\n' "$GODOT_VERSION" > "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          PATH="$RUNNER_TEMP/godot:$PATH" godot --version
          ## pruebas_so.py lanza Godot sin shell: necesita el .exe real, no el script `godot`.
          echo "GODOT=$(cygpath -w "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe")" >> "$GITHUB_ENV"
          cygpath -w "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Extensión C++ (.dll) = GDScript
        shell: bash
        working-directory: dinastia-godot
        run: |
          set +e
          godot --version
          timeout 900 godot --headless --path . res://pruebas/probar_nativo.tscn 2>&1 | tee "$RUNNER_TEMP/nativo.txt"
          grep -q "FIN. 0 fallos" "$RUNNER_TEMP/nativo.txt" || { echo "La extensión nativa no dio «FIN. 0 fallos» en Windows."; exit 1; }

      - name: Mini banco en Windows (grupos guardado, textos, competición y lanzamiento)
        shell: bash
        working-directory: dinastia-godot
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set +e
          malo=0
          for g in guardado textos competicion lanzamiento; do
            bash herramientas/mini_banco.sh "$g" "$(cygpath -u "$RUNNER_TEMP")/mini_$g.txt" || malo=1
          done
          { echo "### 🪟 Windows"; for g in guardado textos competicion lanzamiento; do echo "- $g: $(sed 's/\x1b\[[0-9;]*m//g' "$(cygpath -u "$RUNNER_TEMP")/mini_$g.txt" | grep -a '===== FIN' | tail -1)"; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $malo

      - name: Pruebas por sistema (pruebas/so, las que no necesitan pantalla)
        shell: bash
        working-directory: dinastia-godot
        run: |
          set +e
          log="$(cygpath -u "$RUNNER_TEMP")/so_windows.txt"
          PYTHONIOENCODING=utf-8 python herramientas/pruebas_so.py --requiere headless -j 2 | tee "$log"
          codigo=${PIPESTATUS[0]}
          { echo "### 🪟 Windows · pruebas/so"; python herramientas/tabla_so.py windows="$log"; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      - name: Subir los registros
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-windows-registro
          path: |
            ${{ runner.temp }}/nativo.txt
            ${{ runner.temp }}/mini_*.txt
            ${{ runner.temp }}/so_windows.txt
          if-no-files-found: ignore

  windows-especiales:
    name: 🪟 Windows (especiales sin pantalla ${{ matrix.parte }})
    needs: windows   # corre después: la caché de LFS y de la importación ya está guardada
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parte: [ "0/3", "1/3", "2/3" ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Git sin conversión de fin de línea y con rutas largas
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: |
            dinastia-godot
            .github

      - name: Godot 4.7.2 para Windows (consola, con suma de comprobación)
        shell: bash
        env:
          BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/dl"
          curl --proto "=https" --tlsv1.2 -sSLfo godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          curl --proto "=https" --tlsv1.2 -sSLfo SUMS.txt "$BASE/SHA512-SUMS.txt"
          esperado=$(grep " Godot_v${GODOT_VERSION}-stable_win64.exe.zip\$" SUMS.txt | cut -d' ' -f1)
          real=$(sha512sum godot.zip | cut -d' ' -f1)
          test -n "$esperado" && test "$esperado" = "$real" || { echo "Suma SHA-512 de Godot NO coincide"; exit 1; }
          7z x -y -o"$RUNNER_TEMP/godot" godot.zip > /dev/null
          printf '#!/usr/bin/env bash\nexec "$(dirname "$0")/Godot_v%s-stable_win64_console.exe" "$@"\n' "$GODOT_VERSION" > "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          cygpath -w "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      ## `especiales.sh` sin xvfb-run se salta solo las pruebas que necesitan pantalla; el reparto es el mismo `ESPECIALES_PARTE` del CI de Linux.
      - name: Pruebas especiales (parte ${{ matrix.parte }})
        shell: bash
        working-directory: dinastia-godot
        env:
          ESPECIALES_PARTE: ${{ matrix.parte }}
          TMPDIR: ${{ runner.temp }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          bash herramientas/especiales.sh | tee "$(cygpath -u "$RUNNER_TEMP")/especiales_windows.txt"
          { echo "### 🪟 Windows · especiales, parte ${ESPECIALES_PARTE}"; echo '```'; cat "$(cygpath -u "$RUNNER_TEMP")/especiales_windows.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "^FALLO" "$(cygpath -u "$RUNNER_TEMP")/especiales_windows.txt"

      - name: Subir el registro
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-windows-especiales-${{ strategy.job-index }}
          path: ${{ runner.temp }}/especiales_windows.txt
          if-no-files-found: ignore

  macos:
    name: 🍎 macOS (ejecutar)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: |
            dinastia-godot
            .github

      ## macOS trae bash 3.2, `sed` BSD (sin \x1b) y no trae `timeout`: los scripts del banco usan las versiones GNU.
      - name: Herramientas GNU (timeout, sed)
        shell: bash
        run: |
          brew install coreutils gnu-sed
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Godot 4.7.2 para macOS (con suma de comprobación)
        shell: bash
        env:
          BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/dl"
          curl --proto "=https" --tlsv1.2 -sSLfo godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --proto "=https" --tlsv1.2 -sSLfo SUMS.txt "$BASE/SHA512-SUMS.txt"
          esperado=$(grep " Godot_v${GODOT_VERSION}-stable_macos.universal.zip\$" SUMS.txt | cut -d' ' -f1)
          real=$(shasum -a 512 godot.zip | cut -d' ' -f1)
          test -n "$esperado" && test "$esperado" = "$real" || { echo "Suma SHA-512 de Godot NO coincide"; exit 1; }
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          ln -s "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          echo "GODOT=$RUNNER_TEMP/godot/godot" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/godot" --version

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Mini banco en macOS (grupos guardado, textos, competición y lanzamiento)
        shell: bash
        working-directory: dinastia-godot
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set +e
          malo=0
          for g in guardado textos competicion lanzamiento; do
            bash herramientas/mini_banco.sh "$g" "$RUNNER_TEMP/mini_$g.txt" || malo=1
          done
          { echo "### 🍎 macOS · mini banco"; for g in guardado textos competicion lanzamiento; do echo "- $g: $(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/mini_$g.txt" | grep -a '===== FIN' | tail -1)"; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $malo

      ## No hay .dylib de la extensión C++ para macOS (bin_nativo/dinastia.gdextension): se usa el respaldo GDScript, y
      ## `int_nativo_por_sistema` (en pruebas/so) comprueba justo eso: que NO se espera extensión y que todo funciona sin ella.
      - name: Pruebas por sistema (pruebas/so, las que no necesitan pantalla)
        shell: bash
        working-directory: dinastia-godot
        run: |
          set +e
          PYTHONIOENCODING=utf-8 python3 herramientas/pruebas_so.py --requiere headless -j 2 | tee "$RUNNER_TEMP/so_macos.txt"
          codigo=${PIPESTATUS[0]}
          { echo "### 🍎 macOS · pruebas/so"; python3 herramientas/tabla_so.py macos="$RUNNER_TEMP/so_macos.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      - name: Subir los registros
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-macos-registro
          path: |
            ${{ runner.temp }}/mini_*.txt
            ${{ runner.temp }}/so_macos.txt
          if-no-files-found: ignore

  exportar-web:
    name: 🌐 Web (exportar para el humo)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Exportar Web
        uses: ./.github/actions/exportar
        with:
          variante: web
          preset: Web
          salida: web/index.html
          artefacto: Dinastia-Web-humo

  humo-web:
    name: 🌐 Web (abrir en Chromium)
    needs: exportar-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: dinastia-godot/herramientas

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: Dinastia-Web-humo
          path: salida

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Playwright (solo la biblioteca; se usa el Chrome del runner)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp dinastia-godot/herramientas/humo_web.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright-core@1.49.1

      - name: Abrir el juego y esperar el menú
        shell: bash
        run: |
          ls -la salida
          node "$RUNNER_TEMP/pw/humo_web.mjs" salida "$RUNNER_TEMP/capturas/menu_web.jpg" | tee "$RUNNER_TEMP/humo_web.txt"
          grep -q "FIN. 0 fallos" "$RUNNER_TEMP/humo_web.txt"

      - name: Subir la captura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-web-captura
          path: |
            ${{ runner.temp }}/capturas/menu_web.jpg
            ${{ runner.temp }}/humo_web.txt
          if-no-files-found: ignore

  ## Web con las pruebas por sistema DENTRO: mismo preset Web sin el filtro `pruebas/*` (solo en este export; el publicado sigue sin ellas).
  exportar-web-pruebas:
    name: 🌐 Web (exportar con pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: El preset Web incluye pruebas/
        shell: bash
        working-directory: dinastia-godot
        run: |
          sed -i 's#exclude_filter="pruebas/\*, #exclude_filter="#' export_presets.cfg
          ! grep -q 'exclude_filter="pruebas/' export_presets.cfg
          grep -c 'exclude_filter="addons/cache_horneada' export_presets.cfg

      - name: Exportar Web
        uses: ./.github/actions/exportar
        with:
          variante: web
          preset: Web
          salida: web/index.html
          artefacto: Dinastia-Web-pruebas

  pruebas-web:
    name: 🌐 Web (pruebas/so en Chromium)
    needs: exportar-web-pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: dinastia-godot/herramientas dinastia-godot/pruebas/so

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: Dinastia-Web-pruebas
          path: salida

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Playwright (solo la biblioteca; se usa el Chrome del runner)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp dinastia-godot/herramientas/pruebas_web.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright-core@1.49.1

      - name: Pruebas por sistema en Web
        shell: bash
        run: |
          set +e
          node "$RUNNER_TEMP/pw/pruebas_web.mjs" salida dinastia-godot/pruebas/so/LISTA.txt "$RUNNER_TEMP/so_web.txt"
          codigo=$?
          { echo "### 🌐 Web · pruebas/so"; python3 dinastia-godot/herramientas/tabla_so.py web="$RUNNER_TEMP/so_web.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      - name: Subir el registro
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plataformas-web-so
          path: ${{ runner.temp }}/so_web.txt
          if-no-files-found: ignore

  ## Tabla prueba × sistema con lo que dejaron Windows, macOS y Web (Linux la cubren `especiales.sh` y el banco).
  resumen-so:
    name: 📊 Resumen prueba × sistema
    needs: [windows, macos, pruebas-web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          lfs: false
          sparse-checkout: dinastia-godot/herramientas dinastia-godot/pruebas/so

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          pattern: plataformas-*
          path: registros

      - name: Tabla
        shell: bash
        run: |
          ls -R registros | head -40
          { echo "### 📊 pruebas/so · prueba × sistema"; python3 dinastia-godot/herramientas/tabla_so.py windows=registros/plataformas-windows-registro/so_windows.txt macos=registros/plataformas-macos-registro/so_macos.txt web=registros/plataformas-web-so/so_web.txt; } >> "$GITHUB_STEP_SUMMARY"
