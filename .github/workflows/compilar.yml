name: Export Dinastia Windows

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3  # OJO: el proyecto es Godot 4.7; hace falta una imagen 4.7 (dueño)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates

      - name: Build Windows Release
        run: |
          mkdir -v -p build/windows
          cd dinastia-godot
          godot --headless --export-release "Windows" ../build/windows/Dinastia.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dinastia-Windows
          path: build/windows
