name: Export Dinastia Windows

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Import project
        run: |
          cd dinastia-godot
          godot --headless --import || true

      - name: Build Windows Release
        run: |
          mkdir -v -p build/windows
          cd dinastia-godot
          godot --headless --export-release "Windows Desktop" ../build/windows/Dinastia.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dinastia-Windows
          path: build/windows
