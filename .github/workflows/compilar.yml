# CI de Dinastía (26-10-2026; selector de versión 2-11-2026): Godot 4.7.2, el banco + pruebas especiales y, si pasan, la versión elegida.
#
# - Imagen: barichello/godot-ci:4.7.2 (etiqueta de Docker Hub, sin «-stable»; trae godot,
#   las plantillas de exportación y git-lfs). La 4.3 de antes no abría el proyecto.
# - LFS: solo `dinastia-godot/**` (las ramas y carpetas viejas pesan; ver CLAUDE.md).
# - El banco (`dinastia-godot/herramientas/banco.sh`) tiene que terminar en «FIN. 0 fallos»: se comprueba
#   el código de salida Y el texto del registro, que se sube como artefacto aunque falle.
# - Ningún build ni compilación corre si el banco no pasa. Firmas, keystore y builds públicos los lleva el dueño.
name: Compilar y probar Dinastia

## OBJETIVO (2-11-2026): en «Run workflow» se elige UNA versión y solo corre esa (más el banco, que SIEMPRE
## corre primero: ninguna exportación ni compilación empieza sin que pase). Con un push se hace «todo».
##   todo · windows · linux · android (compila el C++ de Android y exporta el APK) · arm (C++ en Linux arm64) · solo-banco
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      objetivo:
        description: "Qué versión construir (el banco corre siempre)"
        type: choice
        default: todo
        options: [ todo, windows, linux, android, arm, solo-banco ]

## Un push nuevo a la misma rama cancela la ejecución anterior (ahorra minutos y colas).
concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Banco de pruebas entero
        working-directory: dinastia-godot
        run: |
          set +e
          bash herramientas/banco.sh /tmp/banco.txt
          codigo=$?
          set -e
          tail -n 40 /tmp/banco.txt
          if [ "$codigo" -ne 0 ]; then
            echo "El banco terminó con código $codigo (1 fallos, 2 sintaxis, 3 colgado)."
            exit 1
          fi
          grep -q "FIN. 0 fallos" /tmp/banco.txt || { echo "El banco no terminó en «FIN. 0 fallos»."; exit 1; }

      ## Lo que el banco no ve (norma de líneas, auditorías, C++ = GDScript, tráfico, partido con motor real…).
      - name: Pruebas especiales rápidas
        working-directory: dinastia-godot
        run: |
          set +e
          bash herramientas/especiales.sh | tee /tmp/especiales.txt
          grep -q "^FALLO" /tmp/especiales.txt && { echo "Hay pruebas especiales que fallan."; exit 1; }
          exit 0

      - name: Subir el registro del banco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banco-registro
          path: |
            /tmp/banco.txt
            /tmp/especiales.txt
          if-no-files-found: ignore

  export-windows:
    needs: banco
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.objetivo == 'todo' || inputs.objetivo == 'windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Plantillas de exportación
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates; fi

      - name: Build de Windows
        run: |
          mkdir -v -p build/windows
          cd dinastia-godot
          codigo=0
          godot --headless --export-release "Windows" ../build/windows/Dinastia.exe > /tmp/export.txt 2>&1 || codigo=$?
          tail -n 30 /tmp/export.txt
          [ "$codigo" -eq 0 ] || exit "$codigo"
          ## Comprobaciones (30-10-2026): la extensión C++ junto al .exe y las animaciones horneadas
          ## dentro (si faltan, el juego funciona igual pero más lento: se avisa).
          ls -la ../build/windows
          ls ../build/windows/*.dll >/dev/null 2>&1 || echo "::warning::Falta la DLL de la extensión C++ (bin_nativo)"
          grep -q "Caché horneada: 5 archivos" /tmp/export.txt || echo "::warning::Sin caché horneada de animaciones"

      - name: Subir el build
        uses: actions/upload-artifact@v4
        with:
          name: Dinastia-Windows
          path: build/windows

  ## LINUX (30-10-2026): preset público «Linux» (sin caras ni datos reales).
  export-linux:
    needs: banco
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.objetivo == 'todo' || inputs.objetivo == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: Plantillas de exportación
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates; fi

      - name: Build de Linux
        run: |
          mkdir -v -p build/linux
          cd dinastia-godot
          codigo=0
          godot --headless --export-release "Linux" ../build/linux/Dinastia.x86_64 > /tmp/export.txt 2>&1 || codigo=$?
          tail -n 30 /tmp/export.txt
          [ "$codigo" -eq 0 ] || exit "$codigo"
          ls -la ../build/linux
          ls ../build/linux/*.so >/dev/null 2>&1 || echo "::warning::Falta la .so de la extensión C++ (bin_nativo)"
          grep -q "Caché horneada: 5 archivos" /tmp/export.txt || echo "::warning::Sin caché horneada de animaciones"

      - name: Subir el build
        uses: actions/upload-artifact@v4
        with:
          name: Dinastia-Linux
          path: build/linux

  ## ANDROID (30-10-2026): APK de DEPURACIÓN firmada con la clave de depuración de la imagen del CI.
  ## La de publicar (release) se firma con la keystore del dueño, que no está aquí. Sin binario C++
  ## para Android: el juego usa las versiones GDScript (mismo resultado).
  ## LA EXTENSIÓN C++ PARA ANDROID (M-353, 31-10-2026): el contenedor de trabajo no llega al NDK; las máquinas
  ## de GitHub lo traen instalado ($ANDROID_NDK_LATEST_HOME). Se compila arm64 y la usa `export-android`.
  nativo-android:
    needs: banco
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.objetivo == 'todo' || inputs.objetivo == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio (sin LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compilar la extensión (arm64)
        working-directory: dinastia-godot
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q scons
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          bash herramientas/compilar_nativo.sh android
          ls -la bin_nativo/libdinastia.android.*

      - name: Subir la extensión de Android
        uses: actions/upload-artifact@v4
        with:
          name: nativo-android
          path: dinastia-godot/bin_nativo/libdinastia.android.*

  ## LA MISMA EXTENSIÓN EN ARM, PROBADA (M-353): Android no puede correr el banco aquí, así que se compila
  ## para Linux arm64 con las mismas opciones (sin FMA) y `probar_nativo` comprueba en una máquina ARM que
  ## el C++ da los mismos bytes que GDScript.
  nativo-arm:
    needs: banco
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.objetivo == 'todo' || inputs.objetivo == 'arm' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio (sin LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Recursos LFS del juego
        run: git lfs pull --include="dinastia-godot/**"

      - name: Compilar la extensión (Linux arm64)
        working-directory: dinastia-godot
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q scons
          ARCH=arm64 bash herramientas/compilar_nativo.sh linux

      - name: Godot 4.7.2 para arm64
        run: |
          curl -sSLo /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.arm64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.arm64 /usr/local/bin/godot

      - name: Prueba C++ = GDScript en ARM
        working-directory: dinastia-godot
        run: |
          timeout 1500 godot --headless --path . --import > /tmp/importar.txt 2>&1 || true
          timeout 900 godot --headless --path . res://pruebas/probar_nativo.tscn | tee /tmp/nativo.txt
          grep -q "FIN. 0 fallos" /tmp/nativo.txt

  export-android:
    needs: [banco, nativo-android]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.objetivo == 'todo' || inputs.objetivo == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preparar (LFS, caché e importación)
        uses: ./.github/actions/preparar

      - name: La extensión C++ de Android (M-353)
        uses: actions/download-artifact@v4
        with:
          name: nativo-android
          path: dinastia-godot/bin_nativo

      - name: Plantillas y ajustes de Android de la imagen
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config
          if [ "$HOME" != "/root" ]; then
            mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates
            mv /root/.config/godot ~/.config/godot
          fi

      - name: Build de Android (depuración)
        run: |
          mkdir -v -p build/android
          cd dinastia-godot
          godot --headless --export-debug "Android" ../build/android/Dinastia-debug.apk
          ls -la ../build/android
          ## M-353: la extensión C++ tiene que ir dentro del APK (si no, el juego usa la versión GDScript, más lenta).
          unzip -l ../build/android/Dinastia-debug.apk | grep "libdinastia" || { echo "Falta libdinastia en el APK"; exit 1; }

      - name: Subir el build
        uses: actions/upload-artifact@v4
        with:
          name: Dinastia-Android-debug
          path: build/android
