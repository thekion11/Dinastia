# Una versión del juego de principio a fin (2-11-2026): iconos de su color, ajuste del preset,
# exportación, comprobaciones y subida. Va DESPUÉS de checkout y de `preparar`.
name: Exportar una versión
description: Iconos por versión + export de Godot + comprobaciones + artefacto
inputs:
  variante: { description: "windows | windows-ligero | linux | android | android-armv7 | web", required: true }
  preset:   { description: "Nombre del preset de export_presets.cfg", required: true }
  salida:   { description: "Archivo de salida (relativo a build/)", required: true }
  artefacto: { description: "Nombre del artefacto", required: true }
  carpeta:  { description: "Carpeta de build/ que se sube (por defecto, la de la variante)", default: "" }
  formato:  { description: "apk o aab (Android)", default: apk }
  modo:     { description: "release o debug", default: release }
  sufijo:   { description: "Texto de versión (p. ej. -beta2)", default: "" }
  keystore_base64:   { description: "Keystore de Android en base64 (secreto, opcional)", default: "" }
  keystore_usuario:  { description: "Alias de la keystore", default: "" }
  keystore_clave:    { description: "Contraseña de la keystore (secreto)", default: "" }
runs:
  using: composite
  steps:
    - name: Plantillas de exportación
      shell: bash
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates ~/.config
        ## (12-11) Idempotente: en el trabajo Web la acción corre dos veces (Web y Web móvil) y la segunda ya no encontraba
        ## las plantillas que la primera había movido («mv: cannot stat …/*»).
        if [ "$HOME" != "/root" ] && [ -n "$(ls -A /root/.local/share/godot/export_templates 2>/dev/null)" ]; then
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates
        fi
        if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then
          mv /root/.config/godot ~/.config/godot
        fi

    - name: Iconos de la versión (color propio)
      shell: bash
      working-directory: dinastia-godot
      run: |
        python3 -c "import PIL" 2>/dev/null || (apt-get update -qq && apt-get install -y -qq python3 python3-pil)
        python3 herramientas/marca_iconos.py "${{ inputs.variante }}" assets/logo/variante
        ## La marca de la versión DENTRO del juego (ui/componentes/insignia_version.gd lee este archivo).
        case "${{ inputs.variante }}" in
          windows) NOMBRE="Windows" ;; windows-ligero) NOMBRE="Windows ligero" ;; linux) NOMBRE="Linux" ;;
          android) NOMBRE="Android" ;; android-armv7) NOMBRE="Android armv7" ;; web) NOMBRE="Web" ;; *) NOMBRE="${{ inputs.variante }}" ;;
        esac
        printf '{"variante":"%s","nombre":"%s","modo":"%s","sufijo":"%s","commit":"%s","fecha":"%s"}' \
          "${{ inputs.variante }}" "$NOMBRE" "${{ inputs.modo }}" "${{ inputs.sufijo }}" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > datos/build_info.json
        echo "::notice title=${NOMBRE}::Versión ${{ inputs.variante }} · modo ${{ inputs.modo }} · commit ${GITHUB_SHA::7}"
        ## Solo en esta copia del runner: el icono del juego (ventana, web) y el del preset.
        sed -i 's#^config/icon=.*#config/icon="res://assets/logo/variante/icono_256.png"#' project.godot
        ARM=""; [ "${{ inputs.variante }}" = "android-armv7" ] && ARM="--armv7"
        AAB=""; [ "${{ inputs.formato }}" = "aab" ] && AAB="--aab"
        python3 herramientas/ajustar_presets.py "${{ inputs.preset }}" res://assets/logo/variante $ARM $AAB --version="${{ inputs.sufijo }}"
        timeout 900 godot --headless --path . --import > /tmp/importar2.txt 2>&1 || true

    - name: Plantilla de Gradle (solo para el AAB)
      if: ${{ inputs.formato == 'aab' }}
      shell: bash
      working-directory: dinastia-godot
      run: |
        plantilla=$(ls -d ~/.local/share/godot/export_templates/*/ | head -1)
        mkdir -p android/build
        unzip -q -o "${plantilla}android_source.zip" -d android/build
        godot --version | cut -d. -f1-4 | tr -d '\n' > android/.build_version
        cat android/.build_version; echo

    - name: Firma de Android (solo si hay keystore en los secretos)
      id: firma
      if: ${{ inputs.keystore_base64 != '' && inputs.modo == 'release' }}
      shell: bash
      run: |
        echo "${{ inputs.keystore_base64 }}" | base64 -d > "$RUNNER_TEMP/dinastia.keystore"
        {
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/dinastia.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ inputs.keystore_usuario }}"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ inputs.keystore_clave }}"
        } >> "$GITHUB_ENV"
        echo "firmado=si" >> "$GITHUB_OUTPUT"

    - name: Exportar
      shell: bash
      working-directory: dinastia-godot
      run: |
        modo="${{ inputs.modo }}"
        if [ "${{ inputs.preset }}" = "Android" ] && [ "$modo" = "release" ] && [ "${{ steps.firma.outputs.firmado }}" != "si" ]; then
          echo "::warning::Sin keystore en los secretos: el APK sale de DEPURACIÓN (firmado con la clave de depuración)."
          modo=debug
        fi
        salida="../build/${{ inputs.salida }}"
        mkdir -v -p "$(dirname "$salida")"
        codigo=0
        godot --headless --export-$modo "${{ inputs.preset }}" "$salida" > /tmp/export.txt 2>&1 || codigo=$?
        tail -n 30 /tmp/export.txt
        [ "$codigo" -eq 0 ] || exit "$codigo"
        ls -la "$(dirname "$salida")"
        case "${{ inputs.variante }}" in
          windows*) ls ../build/${{ inputs.variante }}/*.dll >/dev/null 2>&1 || echo "::warning::Falta la DLL de la extensión C++" ;;
          linux)    ls ../build/linux/*.so >/dev/null 2>&1 || echo "::warning::Falta la .so de la extensión C++" ;;
          ## (sin «unzip | grep -q»: con pipefail, grep -q corta la tubería y da un falso «falta»)
          android*) if [ "${{ inputs.variante }}" != "android-armv7" ]; then
                      unzip -l "$salida" > /tmp/contenido.txt
                      grep -q libdinastia /tmp/contenido.txt || { echo "Falta libdinastia en el paquete (M-353)"; exit 1; }
                    fi ;;
        esac
        case "${{ inputs.variante }}" in
          android*|web) ;;
          *) grep -q "Caché horneada: 5 archivos" /tmp/export.txt || echo "::warning::Sin caché horneada de animaciones" ;;
        esac

    - name: Marca de la versión junto al build (icono y LEEME)
      shell: bash
      run: |
        d="build/${{ inputs.carpeta || inputs.variante }}"
        cp dinastia-godot/assets/logo/variante/icono_256.png "$d/ICONO-${{ inputs.variante }}.png"
        printf 'DINASTIA\nVersión: %s%s\nVariante: %s\nModo: %s\nCommit: %s\nFecha: %s\n' \
          "$(sed -n 's/^config\/version="\(.*\)"/\1/p' dinastia-godot/project.godot)" "${{ inputs.sufijo }}" \
          "${{ inputs.variante }}" "${{ inputs.modo }}" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > "$d/VERSION.txt"
        cat "$d/VERSION.txt"

    - name: Subir el build
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artefacto }}
        path: build/${{ inputs.carpeta || inputs.variante }}
